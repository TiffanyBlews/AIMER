<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CARE · Meme 检索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg"></div>
  <header class="hero">
    <div class="brand">CARE</div>
    <p class="tagline">用一句话，找回那张梗图</p>
    <form id="search-form" class="search-bar" autocomplete="off">
      <input id="query" type="search" placeholder="例如：吐槽过线普通同学" required />
      <button type="submit">检索</button>
    </form>
    <p id="status" class="status" aria-live="polite"></p>
  </header>

  <main>
    <section id="results" class="grid" hidden></section>
    <nav id="pager" class="pager" hidden>
      <button type="button" id="prev" disabled>上一页</button>
      <span id="page-info"></span>
      <button type="button" id="next" disabled>下一页</button>
    </nav>
  </main>

  <script src="/app.js"></script>
</body>
</html>
